<script>
(function () {
  var g = document.getElementById('gamAge'), root = document.getElementById('root');
  if (!g) return;
  try { if (sessionStorage.getItem('gam-age') === '19+') { g.parentNode.removeChild(g); return; } } catch (e) {}
  document.documentElement.classList.add('gam-age-lock');
  if (root) root.inert = true;
  var ask = g.querySelector('.gam-age-ask'), sorry = g.querySelector('.gam-age-sorry'), yes = g.querySelector('.gam-age-yes');
  setTimeout(function () { try { yes.focus({ preventScroll: true }); } catch (e) {} }, 60);
  g.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-age]');
    if (!b) return;
    var a = b.getAttribute('data-age');
    if (a === 'yes') {
      try { sessionStorage.setItem('gam-age', '19+'); } catch (err) {}
      if (root) root.inert = false;
      document.documentElement.classList.remove('gam-age-lock');
      g.classList.add('out');
      setTimeout(function () { if (g.parentNode) g.parentNode.removeChild(g); }, 500);
    } else if (a === 'no') {
      ask.hidden = true; sorry.hidden = false; sorry.querySelector('button').focus();
    } else {
      sorry.hidden = true; ask.hidden = false; yes.focus();
    }
  });
  g.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var f = Array.prototype.filter.call(g.querySelectorAll('button'), function (x) { return x.offsetParent !== null; });
    if (!f.length) return;
    var i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  });
})();
</script>

<template id="t-our-story" data-meta="{&quot;luxury&quot;: false, &quot;attrs&quot;: {}, &quot;title&quot;: &quot;About Us | Golden Age Meadery&quot;}"><section class="mead-page-hero"><p class="mead-eyebrow"><span></span> About us</p><h1>Turning honey<br/><em>into wine.</em></h1><p class="mead-page-lede">For thousands of years, man has sought to find the sources of joy and transcendence in daily life. Along with music, dancing and art, mankind discovered and harnessed the magic of wine making. As a gift from the Gods, wine was used in spiritual ceremonies, public festivities, and to simply relax and enjoy the company of good friends.</p></section><figure class="mead-wide-photo"><img alt="Salt Spring Island landscape overlooking the water" height="1000" src="img/landscape.webp" width="1920"/><figcaption><svg aria-hidden="true" class="lucide lucide-map-pin" fill="none" height="13" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="13" xmlns="http://www.w3.org/2000/svg"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg> Salt Spring Island, British Columbia</figcaption></figure><section class="mead-prose"><div><p class="mead-eyebrow">01 / The nectar of the gods</p><h2>As old as <em>history.</em></h2></div><div><p>Honey has been utilized in wine making since the dawn of history. The myths of different cultures depict the Gods sipping a drink based on fermented honey with herbs. It is known by many names: the Balche of Central America, the Soma of Ancient India, the Nectar of the Gods in Ancient Greece.</p></div></section><section class="mead-prose"><div><p class="mead-eyebrow">02 / Honey and herbs</p><h2>A potent <em>tradition.</em></h2></div><div><p>Honey is recognized to have a wide range of healing and health-improving powers. When the beneficial properties of various herbs, fruits, berries and spices are combined with honey, they produce a potent beverage offering a variety of benefits to mind and body alike.</p></div></section><section class="mead-prose"><div><p class="mead-eyebrow">03 / Island crafted</p><h2>Local. Natural. <em>Old ways.</em></h2></div><div><p>Our award-winning mead made from wild flower honey and herbs, fruits, and berries grown on Salt Spring Island, British Columbia. With a focus on using local natural ingredients and old tradition method of mead making we pride ourselves in creating a clean local product without adding sulphites.</p></div></section><section class="mead-prose"><div><p class="mead-eyebrow">04 / Our mission</p><h2>Revive the <em>Elixir of Life.</em></h2></div><div><p>Our mission is to reintroduce mead into the world together with other pieces of ancient wisdom that we are beginning to rediscover. It is time to revive this unjustly forgotten Elixir of Life.</p></div></section><section class="mead-award-band"><div class="mead-award-intro"><p class="mead-eyebrow">A tradition worth celebrating</p><p>Time-honored craft.<br/><em>Award-winning character.</em></p></div><div class="mead-award-item"><img alt="2023 All Canada Wine Championships double gold medal" height="300" loading="lazy" src="img/award-2023.webp" width="300"/><p><strong>2023</strong>Best of Category · Double Gold<br/>All Canada Wine Championships</p></div><div class="mead-award-item"><img alt="2016 Okanagan Wine Festivals best of varietal medal" height="300" loading="lazy" src="img/award-2016.webp" width="300"/><p><strong>2016</strong>Best of Varietal · Best Dessert Style Wine<br/>Okanagan Wine Festivals</p></div></section><section class="mead-closing"><p class="mead-eyebrow">For kindred spirits</p><h2>Taste the <em>golden age.</em></h2><a class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium cursor-pointer transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 disabled:cursor-not-allowed [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 bg-primary text-primary-foreground shadow hover:bg-primary/90 h-9 px-4 py-2 mead-primary" href="#store">Shop the meads</a></section></template>
